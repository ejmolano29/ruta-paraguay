<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="Plan de viaje en motorhome por Paraguay: campings con ducha, rutas sin 4x4, check-ins compartidos y Navidad en Posadas.">
<title>Ruta Paraguay · motorhome</title>
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="root">
  <main id="pages">
    <section class="page" id="pg-home"></section>
    <section class="page page-map" id="pg-map">
      <div id="map"></div>
      <div class="map-top">
        <div class="map-chips" id="map-chips"></div>
      </div>
      <button class="map-fit" id="map-fit" aria-label="Ver toda la ruta"></button>
      <div class="map-cards" id="map-cards"></div>
    </section>
    <section class="page" id="pg-plan"></section>
    <section class="page" id="pg-xmas"></section>
    <section class="page" id="pg-credits"></section>
    <section class="page page-stop" id="pg-stop"></section>
  </main>
  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="home"><span class="ti" data-icon="home"></span>Inicio</a>
    <a href="#/mapa" data-tab="map"><span class="ti" data-icon="map"></span>Mapa</a>
    <button class="tab-cta" id="tab-checkin" aria-label="Hacer check-in"><span data-icon="plus"></span></button>
    <a href="#/plan" data-tab="plan"><span class="ti" data-icon="list"></span>Plan</a>
    <a href="#/navidad" data-tab="xmas"><span class="ti" data-icon="tree"></span>Navidad</a>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-h"><div class="grab"></div><h3 id="sheet-t"></h3><button class="icon-btn" id="sheet-x" aria-label="Cerrar"><span data-icon="x"></span></button></div>
  <div class="sheet-b" id="sheet-b"></div>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="assets/data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
